<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
    <title id="title">Laravel Animated Icons</title>
    <desc id="desc">Plug-and-play animated SVG icons for Laravel Blade.</desc>
    <rect width="1280" height="640" fill="#0c0a09"/>
    <circle cx="1120" cy="80" r="280" fill="#064e3b" opacity="0.22"/>
    <circle cx="80" cy="620" r="240" fill="#065f46" opacity="0.16"/>
    <text x="80" y="160" fill="#6ee7b7" font-family="ui-sans-serif, system-ui, sans-serif" font-size="19" font-weight="700" letter-spacing="4">LARAVEL PACKAGE · MIT</text>
    <text x="80" y="250" fill="#fafaf9" font-family="Georgia, serif" font-size="72" font-weight="700">Laravel Animated</text>
    <text x="80" y="330" fill="#fafaf9" font-family="Georgia, serif" font-size="72" font-weight="700">Icons</text>
    <text x="80" y="390" fill="#a8a29e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="24">Plug-and-play animated SVG icons for Blade.</text>
    <text x="80" y="424" fill="#78716c" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20">Hover · click · auto · on-view · manual · no JS build · Livewire-safe</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">
        <rect x="80" y="480" width="560" height="58" rx="12" fill="#1c1917" stroke="#292524"/>
        <text x="102" y="516" fill="#d6d3d1">&lt;x-animated-icon name="sprout" /&gt;</text>
    </g>
    <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600">
        <rect x="80" y="566" width="88" height="30" rx="15" fill="#052e2b" stroke="#134e4a"/>
        <text x="100" y="586" fill="#6ee7b7">Hover</text>
        <rect x="178" y="566" width="82" height="30" rx="15" fill="#052e2b" stroke="#134e4a"/>
        <text x="198" y="586" fill="#6ee7b7">Click</text>
        <rect x="270" y="566" width="72" height="30" rx="15" fill="#052e2b" stroke="#134e4a"/>
        <text x="288" y="586" fill="#6ee7b7">Auto</text>
        <rect x="352" y="566" width="100" height="30" rx="15" fill="#052e2b" stroke="#134e4a"/>
        <text x="370" y="586" fill="#6ee7b7">On view</text>
    </g>
